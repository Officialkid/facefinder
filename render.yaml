services:
  - type: web
    name: facefinder-backend
    env: python
    region: oregon
    plan: free
    rootDir: image-sorter/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: IMAGE_SORTER_TEMP_DIR
        value: /tmp/image_sorter
      - key: IMAGE_SORTER_DOWNLOAD_TIMEOUT_SECONDS
        value: 120
      - key: IMAGE_SORTER_RUN_EMBEDDED_WORKER
        value: "true"
