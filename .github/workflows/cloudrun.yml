name: Deploy FaceFinder AI Backend to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'facefinder-ai' }}
      REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
      SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE || 'facefinder-backend' }}
      REPOSITORY: ${{ secrets.GAR_REPOSITORY || 'facefinder' }}
      IMAGE_NAME: facefinder-backend
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON || secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Authentication Secrets
        id: check_auth
        run: |
          if [ -z "${{ env.GCP_CREDENTIALS_JSON }}" ]; then
            echo "::warning::GCP_CREDENTIALS_JSON secret is not set in GitHub repository settings. Skipping Cloud Run deploy step."
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_auth.outputs.has_auth == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up Cloud SDK
        if: steps.check_auth.outputs.has_auth == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry
        if: steps.check_auth.outputs.has_auth == 'true'
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Docker Image
        if: steps.check_auth.outputs.has_auth == 'true'
        run: |
          IMAGE_URI="gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST_URI="gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" -f Dockerfile .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        if: steps.check_auth.outputs.has_auth == 'true'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 1800 \
            --min-instances 0 \
            --max-instances 5
