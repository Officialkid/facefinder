steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/facefinder-api:${SHORT_SHA:-latest}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/facefinder-api:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/facefinder-api:latest'

  # 3. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'facefinder-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/facefinder-api:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '1800'
      - '--port'
      - '8080'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/facefinder-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
