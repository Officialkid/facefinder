steps:
  # 1. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/facefinder-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/facefinder-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/facefinder-backend:latest'

  # 3. Deploy container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'facefinder-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/facefinder-backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '1800'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/facefinder-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
